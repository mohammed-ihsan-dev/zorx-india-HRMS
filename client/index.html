<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: lets env(safe-area-inset-*) report the notch/status bar and home
         indicator, which the phone shell pads for once (EmployeeLayout, Login, bottom nav). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5138" />
    <meta name="description" content="ZORX INDIA HRMS — attendance, leave, tasks and office management." />

    <!-- iOS Safari does not read manifest.json for home-screen/standalone behavior. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZORX HRMS" />

    <title>ZORX INDIA — Office Management System</title>
    <!-- Before React: start the phone app's pages dark (no white flash behind the status
         bar). Same rule as src/pwa/mobileChrome.js, which takes over once the app runs. -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          var light = ['/admin', '/signup', '/forgot-password', '/reset-password', '/change-password', '/not-authorized'].some(function (x) {
            return p === x || p.indexOf(x + '/') === 0;
          });
          if (!light && window.matchMedia('(max-width: 767.98px)').matches) {
            document.documentElement.setAttribute('data-zm-chrome', 'dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101418');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
